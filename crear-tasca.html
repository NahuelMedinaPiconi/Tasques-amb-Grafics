<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activitats pendents</title>

    <!-- SEO metadata -->
    <meta name="description" content="Pagina web per aplicar tasques i generar un grafic amb chart.js">
    <meta name="keywords" content="Activitats, TODO, projecte, Chart.js">
    <meta name="author" content="Nahuel Medina Piconi">

    <!-- MetaRobots -->
    <meta name="robots" content="index, follow">

    <!-- Opengraph metadata -->
    <meta property="og:title" content="Activitats pendents">
    <meta property="og:description" content="Llista de activitats completa">
    <meta property="og:type" content="website">
    <meta property="og:image" content="i/favicon.png">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="i/favicon.png">

    <!-- Stylesheets -->
    <link rel="stylesheet" type="text/css" href="CSS/style.css">
</head>
<body>
    <main class="flex">
        <aside>
        <h3>Menú</h3>
            <ul>
                <li class="basic-radius"><a href="index.html" class="flex, flex-vcenter">Llistat d'activitats</a></li>
                <li class="basic-radius"><a href="categories.html" class="flex flex-vcenter">Gestio de Categories</a></li>
            </ul>
        </aside>
        <div class="flex flex-column flex-vcenter flex-hstart">
            <h1>Crear Nova Tasca</h1>
            <form class="flex flex-column basic-shadow basic-radius">
                <label for="title">Títol:</label>
                <input class="basic-radius" id="title" type="text" max="20" name="title" required>

                <label for="description">Descripció:</label>
                <textarea class="basic-radius" id="description" name="description" type="text" max="400"></textarea>

                <label for="date">Data entrega:</label>
                <input class="basic-radius" id="date" name="date" type="date">

                <label for="category">Categoria:</label>
                <select class="basic-radius long-select" id="category" name="category"></select>

                <label for="priority">Prioritat:</label>
                <select class="basic-radius long-select" id="priority" name="priority">
                    <option value="low">Baixa</option>
                    <option value="medium">Mediana</option>
                    <option value="high">Alta</option>
                </select>

                <button type="submit" class="large-button">Crear Tasca</button>
            </form>
        </div>
    </main>
    <footer>
        <span>Nahuel Medina Piconi</span>
        <p>nahuelmedina@paucasesnovescifp.org</p>
    </footer>
</body>
</html>
