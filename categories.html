<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activitats pendents</title>

    <!-- SEO metadata -->
    <meta name="description" content="Pagina web per aplicar tasques i generar un grafic amb chart.js">
    <meta name="keywords" content="Activitats, TODO, projecte, Chart.js">
    <meta name="author" content="Nahuel Medina Piconi">

    <!-- MetaRobots -->
    <meta name="robots" content="index, follow">

    <!-- Opengraph metadata -->
    <meta property="og:title" content="Activitats pendents">
    <meta property="og:description" content="Llista de activitats completa">
    <meta property="og:type" content="website">
    <meta property="og:image" content="i/favicon.png">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="i/favicon.png">

    <!-- Stylesheets -->
    <link rel="stylesheet" type="text/css" href="CSS/style.css">
</head>
<body>
    <main class="flex">
        <aside>
            <h3>Menú</h3>
            <ul>
                <li class="basic-radius"><a href="index.html" class="flex flex-vcenter">Llistat d'activitats</a></li>
                <li class="basic-radius"><a href="crear-tasca.html" class="flex flex-vcenter">Crear Tasca</a></li>
            </ul>
        </aside>
        <div class="flex flex-column flex-vcenter">
            <h1>Gestió de Categoria</h1>
            <form id="createCategory" class="basic-shadow basic-radius flex flex-column">
                <label for="new_category">Nova Categoria:</label>
                <input class="basic-radius small-input" id="new_category" name="new_category" type="text" max="40" required>
                <div class="flex flex-vcenter flex-sbetween">
                    <label for="color">Color de la Categoria:</label>
                    <input class="basic-radius small-input" type="color" id="color" name="color" value="#000000"></input>
                </div>

                <button type="submit">Afegir Categoria</button>
            </form>
            <div id="categoryList" class="category-list basic-radius basic-shadow">
                <div class="basic-category flex flex-sbetween flex-vcenter min-p">
                    <div class="flex flex-vcenter flex-sbetween">
                        <div class="category-color"></div>
                        <p>Estudis</p>
                    </div>
                    <button class="delete-button">Eliminar</button> 
                </div>
            </div>
        </div>
    </main>
    <footer>
        <span>Nahuel Medina Piconi</span>
        <p>nahuelmedina@paucasesnovescifp.org</p>
    </footer>
</body>
<script type="module" src="js/categories.js"></script>
</html>
