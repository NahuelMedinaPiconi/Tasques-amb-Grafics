<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activitats pendents</title>

    <!-- SEO metadata -->
    <meta name="description" content="Pagina web per aplicar tasques i generar un grafic amb chart.js">
    <meta name="keywords" content="Activitats, TODO, projecte, Chart.js">
    <meta name="author" content="Nahuel Medina Piconi">

    <!-- MetaRobots -->
    <meta name="robots" content="index, follow">

    <!-- Opengraph metadata -->
    <meta property="og:title" content="Activitats pendents">
    <meta property="og:description" content="Llista de activitats completa">
    <meta property="og:type" content="website">
    <meta property="og:image" content="i/favicon.png">

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="i/favicon.png">

    <!-- Stylesheets -->
    <link rel="stylesheet" type="text/css" href="CSS/style.css">
</head>
<body>
    <main class="flex">
        <aside>
            <h3>Menú</h3>
            <div class="flex flex-vcenter toggle min-p" id="toggle">
                <div class="toggle-ball"></div>
            </div>
            <ul class="flex flex-column flex-sbetween">
                <li class="basic-radius active"><a class="flex flex-vcenter">Llistat d'activitats</a></li>
                <li class="basic-radius"><a href="crear-tasca.html" class="flex flex-vcenter">Crear Tasca</a></li>
                <li class="basic-radius"><a href="categories.html" class="flex flex-vcenter">Gestio de Categories</a></li>
            </ul>
        </aside>
        <div class="flex flex-column flex-vcenter flex-hstart">
            <h1>Llista d'Activitats</h1>
            <div class="basic-shadow flex flex-sbetween flex-vcenter basic-radius basic-shadow">
                <button><a class="flex flex-vcenter" href="crear-tasca.html">Crear Nova Tasca</a></button>
                <button class="disabled"><a class="flex flex-vcenter" href="categories.html">Gestionar Categories</a></button>
                <form id="loadTasks" class="flex min-p flex-hend">
                    <select id="files" class="basic-radius" required>
                        <option disabled selected>Selecciona un JSON...</option>
                        <option>activitats_001.json</option>
                        <option>activitats_002.json</option>
                        <option>activitats_003.xml</option>
                        <option>activitats_004.xml</option>
                    </select>
                    <button class="small_button" type="submit">Pujar</button>
                </form>
            </div>
            <section class="flex flex-column flex-vstart">
                <h2>Tasques pendents</h2>
                <article id="taskList" class="flex task-list">
                </article>
            </section>
            <section>
                <h2>Tasques acabades</h2>
                <article id="unfinishedTasks" class="flex task-list">
                </article>
            </section>
            <section>
                <h2>Gràfica</h2>
                <canvas id="graph">
                </canvas>
            </section>
        </div>
    </main>
</body>
<script type="module" src="js/index.js"></script>
</html>
